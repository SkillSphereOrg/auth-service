# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_service}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Application Name
spring.application.name=auth-service

# Swagger/OpenAPI configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=SkillSphere Auth Service API
springdoc.info.description=Authentication and Authorization API for SkillSphere platform

# JWT Secret (should be overridden in production)
jwt.secret=${JWT_SECRET:changeme-in-production}

# Can use a .env file or environment variables to override these values in Docker or production
