# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Application Name
spring.application.name=auth-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Swagger/OpenAPI configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=SkillSphere Auth Service API
springdoc.info.description=Authentication and Authorization API for SkillSphere platform

# JWT Secret (should be overridden in production)
jwt.secret=${JWT_SECRET:256-bit-secret-your-256-bit-secret}

# Email (SMTP) configuration
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@example.com}
spring.mail.password=${SMTP_PASSWORD:your-email-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:no-reply@skillsphere.com}

# Can use a .env file or environment variables to override these values in Docker or production
